[pytest]
# Async tests everywhere; no decorator noise.
asyncio_mode = auto
# Fixtures that own the database and the ASGI app live for the whole session, so
# the schema is built once. Tests get their own users instead of their own schema,
# which is both faster and a better test: it means every query runs against a
# database that contains other people's rows.
asyncio_default_fixture_loop_scope = session
# Tests share that loop too. Without this, each test would get its own loop while
# the connection pools live on the session loop, and psycopg would eventually be
# asked to use a closed one.
asyncio_default_test_loop_scope = session
testpaths = tests
addopts = -q --strict-markers
markers =
    live: needs real provider credentials; skipped unless RUN_LIVE_TESTS=1
